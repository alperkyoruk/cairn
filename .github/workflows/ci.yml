name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The frontend is embedded from web/dist, which is not committed. Building
      # it here is what proves a clean checkout can produce a release binary.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend and binary
        run: make build

      - name: The binary must carry the frontend
        run: |
          ./cairn -db "$RUNNER_TEMP/ci.db" &
          sleep 2
          curl -fsS http://127.0.0.1:7777/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:7777/api/session | grep -q '"needs_setup":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:7777/mcp)" = "401"
