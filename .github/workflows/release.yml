name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend is built once and embedded into every binary; it is the
      # same bytes on every platform.
      - name: Build the frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="cairn_${VERSION}_${os}_${arch}"
            bin=cairn; [ "$os" = windows ] && bin=cairn.exe

            echo "building $name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath -ldflags="-w -s -X main.version=${VERSION}" \
              -o "dist/$bin" ./cmd/cairn

            cp LICENSE README.md dist/
            if [ "$os" = windows ]; then
              (cd dist && zip -q "../$name.zip" "$bin" LICENSE README.md)
              # A second copy without the version in the name. GitHub serves
              # /releases/latest/download/<asset>, so an unversioned asset gives
              # a URL that keeps working after the next release -- which is what
              # lets the install command on the site be a fixed string that
              # resolves the platform itself.
              cp "$name.zip" "cairn_${os}_${arch}.zip"
            else
              tar -czf "$name.tar.gz" -C dist "$bin" LICENSE README.md
              cp "$name.tar.gz" "cairn_${os}_${arch}.tar.gz"
            fi
            rm -f "dist/$bin"
          done
          rm -rf dist
          sha256sum cairn_*.tar.gz cairn_*.zip > checksums.txt
          cat checksums.txt

      # A binary that cannot serve its own frontend is the failure this whole
      # pipeline exists to prevent, so check before publishing rather than after.
      - name: The linux binary must carry the frontend
        run: |
          tar -xzf "cairn_${VERSION}_linux_amd64.tar.gz" cairn
          ./cairn -version
          ./cairn -db "$RUNNER_TEMP/r.db" &
          sleep 2
          curl -fsS http://127.0.0.1:7777/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:7777/ | grep -qv 'no frontend in this binary'
          rm -f cairn

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            cairn_*.tar.gz cairn_*.zip checksums.txt || \
          gh release upload "$VERSION" cairn_*.tar.gz cairn_*.zip checksums.txt --clobber

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERSION }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The Dockerfile cross-compiles rather than emulating, so both
      # architectures build at native speed and no QEMU setup is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
